<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Immortal Plus</title>
    <script>
      // Applied before first paint so there's no flash of the wrong
      // theme/accent while React boots -- kept in sync with lib/theme.ts,
      // which is the only other place that reads/writes these keys.
      (function () {
        try {
          var theme = localStorage.getItem('immortalplus.theme');
          if (theme === 'light' || (theme !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches && !theme)) {
            document.documentElement.setAttribute('data-theme', 'light');
          }
          var accent = localStorage.getItem('immortalplus.accent');
          if (accent) document.documentElement.style.setProperty('--accent', accent);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
