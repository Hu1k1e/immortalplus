version: '3.8'

services:
  backend:
    image: ghcr.io/hu1k1e/immortalplus-backend:main
    container_name: immortalplus_backend
    ports:
      - "9486:8000"
      - "9487:8000" # GSI port
    volumes:
      - immortalplus_data:/app/data
      - immortalplus_replays:/app/replays
    environment:
      - DATA_DIR=/app/data
      - REPLAYS_DIR=/app/replays
      - FRONTEND_URL=http://localhost:9485
      - REPLAY_PARSER_URL=http://replay_parser:5600
    restart: unless-stopped

  frontend:
    image: ghcr.io/hu1k1e/immortalplus-frontend:main
    container_name: immortalplus_frontend
    ports:
      - "9485:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Replay Parser (fork of OpenDota's Java Clarity Service — see parser/README.md
  # for the patch that adds real per-second HP/Mana to interval entries)
  replay_parser:
    image: ghcr.io/hu1k1e/immortalplus-parser:main
    container_name: immortalplus_parser
    ports:
      - "5600:5600"
    restart: unless-stopped

  # GC bot (see gc-bot/README.md) — resolves cluster/replaySalt for
  # arbitrary match IDs via a live Steam/Dota 2 Game Coordinator session,
  # for matches OpenDota/Stratz haven't indexed. Needs STEAM_BOT_USERNAME/
  # STEAM_BOT_PASSWORD set for a dedicated (not your main) Steam account
  # with Dota 2 in its library — set these in Portainer's stack environment
  # variables, never commit them. First start requires watching this
  # container's logs for a Steam Guard prompt and submitting the code via
  # `curl -X POST http://<host>:3500/steamguard -d '{"code":"XXXXX"}'`;
  # subsequent restarts skip that as long as the gc_bot_data volume persists.
  gc_bot:
    image: ghcr.io/hu1k1e/immortalplus-gc-bot:main
    container_name: immortalplus_gc_bot
    ports:
      - "3500:3500"
    volumes:
      - immortalplus_gcbot_data:/app/data
    environment:
      - STEAM_BOT_USERNAME=${STEAM_BOT_USERNAME}
      - STEAM_BOT_PASSWORD=${STEAM_BOT_PASSWORD}
    restart: unless-stopped

volumes:
  immortalplus_data:
    name: immortalplus_data
  immortalplus_replays:
    name: immortalplus_replays
  immortalplus_gcbot_data:
    name: immortalplus_gcbot_data
